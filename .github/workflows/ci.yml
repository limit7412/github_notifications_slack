name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: format / lint / spec
    runs-on: ubuntu-24.04-arm
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # crystal: latest だと Crystal の更新でいきなり CI が壊れるため固定する。
      # 上げるときは ameba 側の対応状況も合わせて確認すること（issue #108）。
      - name: install crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: install shards
        run: shards install

      - name: check format
        run: crystal tool format --check

      - name: lint with ameba
        run: ./bin/ameba

      - name: run specs
        run: crystal spec
