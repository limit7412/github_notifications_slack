name: serverless

on:
  push:
    branches: [master]

# master へ短時間に複数回マージすると deploy が並走し、スタック
# github-notifications-slack-prod が UPDATE_IN_PROGRESS のままで後発が
# 落ちうる。dev 側（issue #112 / PR #113）と同じ理由なので同じ形で防ぐ
# （issue #114）。
#
# cancel-in-progress は false。実行中のデプロイを打ち切るとスタックが
# 中途半端な状態で残りうるため、待たせる方を選ぶ。
#
# 待機中の run は最新 1 本しか保持されず、3 回続けてマージすると中間の run は
# キャンセルされる。prod は master の内容をデプロイするので、最新の run さえ
# 通れば最終状態は正しく、むしろ無駄なデプロイが減る。dev と違いこのキャンセルは
# 実害にならない。
concurrency:
  group: serverless-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - name: setup node.js
        uses: actions/setup-node@v4

      - name: install sls
        run: npm i -g serverless

      - name: checkout
        uses: actions/checkout@v4

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: get env
        run: |
          aws s3 cp s3://limit7412-workflow-env/github_notifications_slack/prod/env.yml .

      - name: install plugins
        run: npm install

      - name: deploy
        run: sls deploy --stage prod
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
